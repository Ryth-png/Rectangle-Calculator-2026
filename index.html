<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persegi Panjang Premium</title>
    <style>
        :root {
            --bg-1: #f6efe7;
            --bg-2: #fef2c7;
            --paper: #fffdf7;
            --paper-2: #fef7eb;
            --panel: #fffaf1;
            --ink: #111111;
            --accent: #ff6b35;
            --accent-2: #6d5ef6;
            --accent-3: #2dd4bf;
            --yellow: #ffe66d;
            --green: #c9ef6d;
            --line: rgba(17, 17, 17, 0.96);
            --text: #1d1d1d;
            --muted: #4b4b4b;
            --shadow: rgba(17, 17, 17, 0.92);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif;
            background:
                linear-gradient(135deg, rgba(255, 107, 53, 0.08), rgba(109, 94, 246, 0.08)),
                repeating-linear-gradient(
                    0deg,
                    rgba(17,17,17,0.025),
                    rgba(17,17,17,0.025) 2px,
                    transparent 2px,
                    transparent 7px
                ),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            overflow-x: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(18px);
            opacity: 0.65;
            pointer-events: none;
        }

        .orb-one {
            width: 240px;
            height: 240px;
            background: rgba(255, 107, 53, 0.16);
            top: 8%;
            left: 8%;
        }

        .orb-two {
            width: 280px;
            height: 280px;
            background: rgba(109, 94, 246, 0.14);
            bottom: 4%;
            right: 8%;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            width: min(1100px, 100%);
            display: grid;
            grid-template-columns: 1.05fr 1.25fr;
            gap: 28px;
            padding: 18px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,248,239,0.9)),
                repeating-linear-gradient(
                    90deg,
                    rgba(17,17,17,0.02),
                    rgba(17,17,17,0.02) 2px,
                    transparent 2px,
                    transparent 9px
                );
            border: 3px solid var(--line);
            border-radius: 28px 18px 22px 14px;
            box-shadow: 12px 12px 0 var(--shadow);
            transform: none !important;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 249, 240, 0.92)),
                repeating-linear-gradient(
                    0deg,
                    rgba(17,17,17,0.015),
                    rgba(17,17,17,0.015) 2px,
                    transparent 2px,
                    transparent 8px
                );
            border: 3px solid var(--line);
            border-radius: 20px 28px 18px 26px;
            padding: 26px 22px;
            box-shadow: 7px 7px 0 rgba(17,17,17,0.9);
            transform: none !important;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 12px;
            border-radius: 999px;
            background: #ffeb3b;
            color: var(--ink);
            border: 3px solid var(--line);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.72rem;
            font-weight: 900;
            box-shadow: 3px 3px 0 rgba(17,17,17,0.9);
        }

        h1 {
            margin: 18px 0 24px;
            font-size: clamp(2rem, 3vw, 3rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            color: #111827;
        }

        .input-group {
            display: grid;
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        input,
        select {
            width: 100%;
            border: 3px solid var(--line);
            background: rgba(255, 255, 255, 0.88);
            color: var(--text);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: inset 0 0 0 1px rgba(17,17,17,0.08);
        }

        input:focus,
        select:focus {
            border-color: var(--ink);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
            background: #fffefc;
            transform: translateY(-1px) scale(1.01);
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        button {
            flex: 1;
            border: 3px solid var(--line);
            border-radius: 16px 10px 18px 12px;
            padding: 14px 18px;
            font-weight: 900;
            font-size: 0.98rem;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 4px 4px 0 rgba(17,17,17,0.95);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 6px 6px 0 rgba(17,17,17,0.95);
            filter: saturate(1.15);
        }

        button:active,
        button.pressed {
            transform: translateY(2px);
            box-shadow: 1px 1px 0 rgba(17,17,17,0.95);
        }

        .primary-btn {
            background: linear-gradient(135deg, #ffbf75, #ff7b4d);
            color: #111;
            border-radius: 18px 12px 14px 10px;
        }

        .secondary-btn {
            background: linear-gradient(135deg, #dffb98, #c9ef6d);
            color: #111;
            border-radius: 12px 18px 10px 14px;
        }

        .mini-btn {
            flex: 0 0 auto;
            min-width: 128px;
            background: linear-gradient(135deg, #d9c7ff, #b9cbff);
            color: #111;
            transform: none;
            border-radius: 12px 18px 16px 10px;
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .title-row h1 {
            margin-right: auto;
        }

        .mood-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 22px;
            padding: 12px 14px;
            border-radius: 16px;
            background: #fef3c7;
            border: 3px solid var(--line);
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 800;
            box-shadow: 4px 4px 0 rgba(17,17,17,0.9);
        }

        .mood-card strong {
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        .sparkle-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            opacity: 0.6;
        }

        .burst {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            opacity: 0.8;
        }

        .stats {
            margin-top: 22px;
            display: grid;
            gap: 12px;
        }

        .stat-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(248, 250, 255, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .stat-card .label {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .stat-card .value {
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .visual-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .visual-box {
            background: linear-gradient(180deg, rgba(248, 250, 255, 0.98), rgba(237, 242, 255, 0.9));
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 18px;
            overflow: hidden;
        }

        .visual-box h2 {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .shape {
            fill: rgba(109, 94, 246, 0.82);
            stroke: rgba(79, 70, 229, 0.95);
            stroke-width: 3;
            filter: drop-shadow(0 8px 18px rgba(109, 94, 246, 0.18));
            transition: x 0.2s ease, y 0.2s ease, width 0.25s ease, height 0.25s ease, rx 0.2s ease;
        }

        .grid-line {
            stroke: rgba(148, 163, 184, 0.18);
            stroke-width: 1;
        }

        .dimension-line {
            stroke: rgba(30, 41, 59, 0.8);
            stroke-width: 2;
            stroke-dasharray: 7 7;
            transition: x1 0.4s ease, x2 0.4s ease, y1 0.4s ease, y2 0.4s ease;
        }

        .dimension-text {
            font-size: 13px;
            fill: #1f2937;
            font-weight: 700;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .result-box {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,248,239,0.92)),
                repeating-linear-gradient(90deg, rgba(17,17,17,0.02), rgba(17,17,17,0.02) 2px, transparent 2px, transparent 8px);
            border: 3px solid var(--line);
            border-radius: 24px;
            padding: 18px;
            display: grid;
            gap: 12px;
            box-shadow: 5px 5px 0 rgba(17,17,17,0.88);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.78);
            border: 2px solid rgba(17,17,17,0.9);
            padding: 12px 14px;
            transform: none;
        }

        .result-row .label {
            color: var(--muted);
            font-weight: 700;
        }

        .value {
            font-weight: 800;
            color: #111827;
            font-size: 1.08rem;
        }

        .unit-tag {
            font-size: 0.75rem;
            color: var(--muted);
            margin-left: 4px;
        }

        @media (max-width: 900px) {
            body {
                padding: 20px 14px;
            }

            .app-shell {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 14px;
            }

            .panel {
                padding: 18px 16px;
            }

            .title-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .button-row {
                flex-direction: column;
            }

            .mini-btn {
                width: 100%;
                min-width: 0;
            }

            .mood-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .badge {
                font-size: 0.65rem;
                letter-spacing: 0.05em;
            }

            h1 {
                font-size: 1.8rem;
            }

            .field,
            .button-row,
            .stat-card,
            .result-row {
                gap: 8px;
            }

            .stat-card,
            .result-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .value {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>

    <div class="app-shell">
        <div class="panel">
            <div class="badge">Advanced Calculator</div>
            <div class="title-row">
                <h1>Luas & Keliling<br>Persegi Panjang</h1>
                <button id="surpriseBtn" class="mini-btn" type="button">✨ Surprise</button>
            </div>

            <div class="input-group">
                <div class="field">
                    <label for="panjang">Panjang</label>
                    <input id="panjang" type="number" value="10" min="0" step="any" aria-label="Panjang">
                </div>

                <div class="field">
                    <label for="lebar">Lebar</label>
                    <input id="lebar" type="number" value="5" min="0" step="any" aria-label="Lebar">
                </div>

                <div class="field">
                    <label for="satuan">Satuan</label>
                    <select id="satuan" aria-label="Satuan">
                        <option value="m">Meter (m)</option>
                        <option value="cm">Centimeter (cm)</option>
                    </select>
                </div>

                <div class="button-row">
                    <button id="hitung" class="primary-btn" type="button">Hitung</button>
                    <button id="reset" class="secondary-btn" type="button">Reset</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <span class="label">Panjang</span>
                    <span class="value"><span id="panjangTampil">10</span><span class="unit-tag" id="satuanPanjang">m</span></span>
                </div>
                <div class="stat-card">
                    <span class="label">Lebar</span>
                    <span class="value"><span id="lebarTampil">5</span><span class="unit-tag" id="satuanLebar">m</span></span>
                </div>
            </div>

            <div class="mood-card">
                <span>Vibe hari ini</span>
                <strong id="moodText">🔥 Siap menghitung!</strong>
            </div>
        </div>

        <div class="visual-panel panel">
            <div class="visual-box">
                <h2>Visualisasi</h2>
                <svg viewBox="0 0 360 260" aria-label="Visualisasi bentuk persegi panjang">
                    <g>
                        <line class="grid-line" x1="20" y1="220" x2="340" y2="220"></line>
                        <line class="grid-line" x1="20" y1="180" x2="340" y2="180"></line>
                        <line class="grid-line" x1="20" y1="140" x2="340" y2="140"></line>
                        <line class="grid-line" x1="20" y1="100" x2="340" y2="100"></line>
                        <line class="grid-line" x1="20" y1="60" x2="340" y2="60"></line>
                        <line class="grid-line" x1="80" y1="30" x2="80" y2="230"></line>
                        <line class="grid-line" x1="140" y1="30" x2="140" y2="230"></line>
                        <line class="grid-line" x1="200" y1="30" x2="200" y2="230"></line>
                        <line class="grid-line" x1="260" y1="30" x2="260" y2="230"></line>
                        <line class="grid-line" x1="320" y1="30" x2="320" y2="230"></line>
                    </g>

                    <line class="dimension-line" id="lineWidth1" x1="60" y1="200" x2="300" y2="200"></line>
                    <line class="dimension-line" id="lineWidth2" x1="60" y1="192" x2="60" y2="208"></line>
                    <line class="dimension-line" id="lineWidth3" x1="300" y1="192" x2="300" y2="208"></line>
                    <line class="dimension-line" id="lineHeight1" x1="45" y1="50" x2="45" y2="200"></line>
                    <line class="dimension-line" id="lineHeight2" x1="38" y1="50" x2="52" y2="50"></line>
                    <line class="dimension-line" id="lineHeight3" x1="38" y1="200" x2="52" y2="200"></line>

                    <rect id="shapeRect" class="shape" x="75" y="70" width="200" height="100" rx="12"></rect>
                    <text id="widthLabel" class="dimension-text" x="180" y="235" text-anchor="middle">10 m</text>
                    <text id="heightLabel" class="dimension-text" x="20" y="137" text-anchor="middle" transform="rotate(-90 20 137)">5 m</text>
                    <text id="shapeLabel" class="dimension-text" x="180" y="95" text-anchor="middle" fill="#e8f0ff">10 m × 5 m</text>
                </svg>
            </div>

            <div class="result-box">
                <div class="result-row">
                    <span class="label">Luas</span>
                    <span class="value"><span id="luas">50</span><span class="unit-tag" id="satuanLuas">m</span><sup>2</sup></span>
                </div>
                <div class="result-row">
                    <span class="label">Keliling</span>
                    <span class="value"><span id="keliling">30</span><span class="unit-tag" id="satuanKeliling">m</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const panjangInput = document.getElementById("panjang");
        const lebarInput = document.getElementById("lebar");
        const satuanSelect = document.getElementById("satuan");
        const hitungBtn = document.getElementById("hitung");
        const resetBtn = document.getElementById("reset");
        const surpriseBtn = document.getElementById("surpriseBtn");
        const moodText = document.getElementById("moodText");
        const sparkleLayer = document.getElementById("sparkleLayer");

        let audioContext;

        const shapeRect = document.getElementById("shapeRect");
        const widthLabel = document.getElementById("widthLabel");
        const heightLabel = document.getElementById("heightLabel");
        const shapeLabel = document.getElementById("shapeLabel");

        const lineWidth1 = document.getElementById("lineWidth1");
        const lineWidth2 = document.getElementById("lineWidth2");
        const lineWidth3 = document.getElementById("lineWidth3");
        const lineHeight1 = document.getElementById("lineHeight1");
        const lineHeight2 = document.getElementById("lineHeight2");
        const lineHeight3 = document.getElementById("lineHeight3");

        const defaultState = {
            panjang: 10,
            lebar: 5,
            satuan: "m"
        };

        function formatNumber(value) {
            if (!isFinite(value)) return "0";
            return Number(value).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
        }

        function createSparkles() {
            sparkleLayer.innerHTML = "";
            for (let i = 0; i < 18; i++) {
                const sparkle = document.createElement("span");
                sparkle.className = "sparkle";
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.top = `${Math.random() * 100}%`;
                sparkle.style.animationDelay = `${(Math.random() * 2.5).toFixed(2)}s`;
                sparkleLayer.appendChild(sparkle);
            }
        }

        function createBurst(x, y) {
            const colors = ["#6d5ef6", "#14b8a6", "#f59e0b", "#f472b6", "#60a5fa"];
            for (let i = 0; i < 18; i++) {
                const particle = document.createElement("span");
                particle.className = "burst";
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = colors[i % colors.length];
                particle.style.setProperty("--dx", `${(Math.random() * 120 - 60).toFixed(0)}px`);
                particle.style.setProperty("--dy", `${(Math.random() * 120 - 60).toFixed(0)}px`);
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 900);
            }
        }

        function triggerButtonFeedback(button) {
            button.classList.remove("pressed");
            void button.offsetWidth;
            button.classList.add("pressed");
            button.animate([
                { transform: "translateY(0) rotate(0deg) scale(1)" },
                { transform: "translateY(-2px) rotate(-4deg) scale(1.06)" },
                { transform: "translateY(3px) rotate(4deg) scale(0.98)" },
                { transform: "translateY(0) rotate(0deg) scale(1)" }
            ], {
                duration: 180,
                easing: "cubic-bezier(.2,.9,.2,1)"
            });
            setTimeout(() => button.classList.remove("pressed"), 180);
        }

        function animateShapePulse() {
            shapeRect.classList.remove("pulse");
            void shapeRect.getBoundingClientRect();
            shapeRect.classList.add("pulse");
        }

        function playTone(frequency, duration, type = "triangle", volume = 0.03) {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return;

            if (!audioContext) {
                audioContext = new AudioCtor();
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const now = audioContext.currentTime;

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, now);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        function playSound(type = "tap") {
            if (type === "tap") {
                playTone(520, 0.08, "square", 0.05);
                setTimeout(() => playTone(640, 0.08, "triangle", 0.04), 50);
            }
            if (type === "reset") {
                playTone(260, 0.12, "sawtooth", 0.04);
            }
            if (type === "surprise") {
                playTone(440, 0.09, "triangle", 0.05);
                setTimeout(() => playTone(660, 0.12, "triangle", 0.05), 80);
                setTimeout(() => playTone(880, 0.14, "square", 0.05), 160);
            }
        }

        function setMood(message) {
            moodText.textContent = message;
        }

        function stabilizeLayout() {
            const fixedEls = [
                document.querySelector(".app-shell"),
                document.querySelector(".panel"),
                document.querySelector(".mini-btn")
            ];

            fixedEls.forEach((el) => {
                if (!el) return;
                el.style.transform = "none";
                el.style.webkitTransform = "none";
                el.style.mozTransform = "none";
            });
        }

        function updateVisualisasi(panjang, lebar) {
            const maxSide = Math.max(panjang, lebar, 1);
            const minWidth = 110;
            const minHeight = 60;
            const maxWidth = 220;
            const maxHeight = 120;

            const visualWidth = Math.max(minWidth, Math.min(maxWidth, (panjang / maxSide) * 220));
            const visualHeight = Math.max(minHeight, Math.min(maxHeight, (lebar / maxSide) * 120));

            const x = (360 - visualWidth) / 2;
            const y = (260 - visualHeight) / 2;

            shapeRect.setAttribute("x", x);
            shapeRect.setAttribute("y", y);
            shapeRect.setAttribute("width", visualWidth);
            shapeRect.setAttribute("height", visualHeight);
            shapeRect.setAttribute("rx", 12);

            lineWidth1.setAttribute("x1", x);
            lineWidth1.setAttribute("x2", x + visualWidth);
            lineWidth1.setAttribute("y1", 210);
            lineWidth1.setAttribute("y2", 210);

            lineWidth2.setAttribute("x1", x);
            lineWidth2.setAttribute("x2", x);
            lineWidth2.setAttribute("y1", 202);
            lineWidth2.setAttribute("y2", 218);

            lineWidth3.setAttribute("x1", x + visualWidth);
            lineWidth3.setAttribute("x2", x + visualWidth);
            lineWidth3.setAttribute("y1", 202);
            lineWidth3.setAttribute("y2", 218);

            lineHeight1.setAttribute("x1", 52);
            lineHeight1.setAttribute("x2", 52);
            lineHeight1.setAttribute("y1", y);
            lineHeight1.setAttribute("y2", y + visualHeight);

            lineHeight2.setAttribute("x1", 44);
            lineHeight2.setAttribute("x2", 60);
            lineHeight2.setAttribute("y1", y);
            lineHeight2.setAttribute("y2", y);

            lineHeight3.setAttribute("x1", 44);
            lineHeight3.setAttribute("x2", 60);
            lineHeight3.setAttribute("y1", y + visualHeight);
            lineHeight3.setAttribute("y2", y + visualHeight);

            const satuan = satuanSelect.value;
            widthLabel.textContent = `${formatNumber(panjang)} ${satuan}`;
            heightLabel.textContent = `${formatNumber(lebar)} ${satuan}`;
            shapeLabel.textContent = `${formatNumber(panjang)} ${satuan} × ${formatNumber(lebar)} ${satuan}`;

            widthLabel.style.opacity = "1";
            heightLabel.style.opacity = "1";
            shapeLabel.style.opacity = "1";
        }

        function hitungPersegiPanjang() {
            const panjang = parseFloat(panjangInput.value) || 0;
            const lebar = parseFloat(lebarInput.value) || 0;
            const satuan = satuanSelect.value;

            const luas = panjang * lebar;
            const keliling = 2 * (panjang + lebar);

            document.getElementById("panjangTampil").textContent = formatNumber(panjang);
            document.getElementById("lebarTampil").textContent = formatNumber(lebar);
            document.getElementById("luas").textContent = formatNumber(luas);
            document.getElementById("keliling").textContent = formatNumber(keliling);

            document.getElementById("satuanPanjang").textContent = satuan;
            document.getElementById("satuanLebar").textContent = satuan;
            document.getElementById("satuanLuas").textContent = satuan;
            document.getElementById("satuanKeliling").textContent = satuan;

            if (luas > 0 && keliling > 0) {
                setMood("✨ Hasilnya kece banget!");
            } else {
                setMood("😅 Masih ada angka yang kosong");
            }

            animateShapePulse();
            updateVisualisasi(panjang, lebar);
        }

        function resetForm() {
            panjangInput.value = defaultState.panjang;
            lebarInput.value = defaultState.lebar;
            satuanSelect.value = defaultState.satuan;
            setMood("🔄 Form sudah direset");
            playSound("reset");
            hitungPersegiPanjang();
        }

        function randomizeValues() {
            const panjangAcak = (Math.random() * 18 + 2).toFixed(1);
            const lebarAcak = (Math.random() * 12 + 1).toFixed(1);
            const satuanAcak = Math.random() > 0.5 ? "m" : "cm";

            panjangInput.value = panjangAcak;
            lebarInput.value = lebarAcak;
            satuanSelect.value = satuanAcak;
            hitungPersegiPanjang();
            setMood("🎉 Kode random-nya lagi aktif!");
            playSound("surprise");
            createBurst(window.innerWidth / 2, window.innerHeight / 2);
        }

        panjangInput.addEventListener("input", hitungPersegiPanjang);
        lebarInput.addEventListener("input", hitungPersegiPanjang);
        satuanSelect.addEventListener("change", hitungPersegiPanjang);
        hitungBtn.addEventListener("click", () => {
            triggerButtonFeedback(hitungBtn);
            playSound("tap");
            hitungPersegiPanjang();
            const rect = hitungBtn.getBoundingClientRect();
            createBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            setMood("💥 Hitungnya berhasil!");
        });
        resetBtn.addEventListener("click", () => {
            triggerButtonFeedback(resetBtn);
            playSound("reset");
            resetForm();
        });
        surpriseBtn.addEventListener("click", () => {
            triggerButtonFeedback(surpriseBtn);
            playSound("surprise");
            randomizeValues();
        });

        createSparkles();
        animateShapePulse();
        stabilizeLayout();
        hitungPersegiPanjang();
        window.addEventListener("resize", stabilizeLayout);
    </script>
</body>
</html>
